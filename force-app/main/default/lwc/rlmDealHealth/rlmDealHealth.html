<template>
    <lightning-card title="Deal analysis" icon-name="standard:metrics">
        <div slot="actions">
            <lightning-button
                label="Refresh analysis"
                variant="neutral"
                onclick={handleRun}
                disabled={running}
                title="Re-run Deal Desk inspect. The Deal Desk Assistant also runs this on load.">
            </lightning-button>
        </div>

        <template if:true={loadError}>
            <div class="slds-p-around_medium slds-text-color_error" role="alert">
                Could not load quote fields. Confirm Deal Health fields are deployed.
            </div>
        </template>

        <template if:true={quote}>
            <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                <div class="slds-grid slds-gutters slds-wrap">
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                        <p class="slds-text-title slds-m-bottom_xx-small">Status</p>
                        <p class={statusClass}>{healthStatus}</p>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                        <p class="slds-text-title slds-m-bottom_xx-small">Blended margin</p>
                        <p class="slds-text-heading_medium">{marginLabel}</p>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                        <p class="slds-text-title slds-m-bottom_xx-small">Net</p>
                        <p class="slds-text-heading_small">{grandTotal}</p>
                    </div>
                </div>

                <div class="slds-grid slds-gutters slds-wrap slds-m-top_medium">
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <p class="slds-text-title slds-m-bottom_xx-small">Account</p>
                        <p>{endCustomer}</p>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <p class="slds-text-title slds-m-bottom_xx-small">Partner Account (optional)</p>
                        <p>{partnerName}</p>
                    </div>
                </div>

                <p class="slds-text-title slds-m-top_medium slds-m-bottom_xx-small">PC justification</p>
                <p class="slds-text-body_regular">{pcJustification}</p>

                <template if:true={pcCompare}>
                    <p class="slds-text-title slds-m-top_medium slds-m-bottom_xx-small">Compared to last Price Concession</p>
                    <p class="slds-text-body_regular">{pcCompare}</p>
                </template>

                <p class="slds-text-title slds-m-top_medium slds-m-bottom_xx-small">Flags</p>
                <ul class="slds-list_dotted">
                    <template for:each={flagLines} for:item="line">
                        <li key={line}>{line}</li>
                    </template>
                </ul>

                <p class="slds-text-title slds-m-top_medium slds-m-bottom_xx-small">Recommended next steps</p>
                <ol class="slds-list_ordered">
                    <template for:each={stepLines} for:item="step">
                        <li key={step}>{step}</li>
                    </template>
                </ol>

                <p class="slds-text-body_small slds-text-color_weak slds-m-top_medium">
                    Last analysis: {lastRun}. Runs when you open this tab. Refresh to compare again after line changes.
                </p>
                <p class="slds-text-body_small slds-m-top_xx-small">Quote {quoteName} · {quoteStatus}</p>
            </div>
        </template>
    </lightning-card>
</template>
